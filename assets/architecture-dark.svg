<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="1200" height="390" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" role="img" aria-label="Architecture of e-commerce-agents: a user reaches a Next.js storefront, which calls an orchestrator with a JWT. The orchestrator calls five specialist agents over A2A (product search, orders, pricing, reviews, inventory), backed by PostgreSQL with pgvector. Risky actions route to human approval, and traces and cost go to OpenTelemetry. The signed-in user's identity is carried on every hop."><title>Architecture of e-commerce-agents: a user reaches a Next.js storefront, which calls an orchestrator with a JWT. The orchestrator calls five specialist agents over A2A (product search, orders, pricing, reviews, inventory), backed by PostgreSQL with pgvector. Risky actions route to human approval, and traces and cost go to OpenTelemetry. The signed-in user's identity is carried on every hop.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><path d="M190 52 V36 H1010 V52" fill="none" stroke="#0d9488" stroke-width="2" stroke-dasharray="3 5"/><rect x="405" y="22" width="390" height="28" rx="14" fill="#0d9488"/><text x="600" y="41" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Signed-in user identity on every hop</text><rect x="20" y="191" width="100" height="48" rx="24" fill="none" stroke="#64748b" stroke-width="2"/><text x="70" y="222" text-anchor="middle" font-size="19" font-weight="700" fill="#f1f5f9">User</text><line x1="120" y1="215" x2="166" y2="215" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><rect x="170" y="173" width="210" height="84" rx="10" fill="#1d4ed8" stroke="#93c5fd" stroke-width="2"/><text x="275.0" y="211.0" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Storefront</text><text x="275.0" y="234.0" text-anchor="middle" font-size="15" fill="#fff" fill-opacity=".9">Next.js, streaming chat</text><line x1="380" y1="215" x2="456" y2="215" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><text x="418" y="203" text-anchor="middle" font-size="15" font-weight="600" fill="#94a3b8">JWT</text><rect x="460" y="173" width="230" height="84" rx="10" fill="#0d9488" stroke="#5eead4" stroke-width="2"/><text x="575.0" y="211.0" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Orchestrator</text><text x="575.0" y="234.0" text-anchor="middle" font-size="15" fill="#fff" fill-opacity=".9">5 orchestration modes</text><line x1="690" y1="215" x2="786" y2="215" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><text x="738" y="203" text-anchor="middle" font-size="15" font-weight="600" fill="#94a3b8">A2A</text><rect x="790" y="62" width="220" height="306" rx="14" fill="#161f2e" stroke="#334155" stroke-width="2"/><text x="900" y="90" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.5" fill="#94a3b8">SPECIALIST AGENTS</text><rect x="810" y="104" width="180" height="41" rx="10" fill="#1d4ed8" stroke="#93c5fd" stroke-width="2"/><text x="900.0" y="131.5" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Product search</text><rect x="810" y="155" width="180" height="41" rx="10" fill="#1d4ed8" stroke="#93c5fd" stroke-width="2"/><text x="900.0" y="182.5" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Orders</text><rect x="810" y="206" width="180" height="41" rx="10" fill="#1d4ed8" stroke="#93c5fd" stroke-width="2"/><text x="900.0" y="233.5" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Pricing</text><rect x="810" y="257" width="180" height="41" rx="10" fill="#1d4ed8" stroke="#93c5fd" stroke-width="2"/><text x="900.0" y="284.5" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Reviews</text><rect x="810" y="308" width="180" height="41" rx="10" fill="#1d4ed8" stroke="#93c5fd" stroke-width="2"/><text x="900.0" y="335.5" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Inventory</text><line x1="1010" y1="215" x2="1066" y2="215" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M1070 177 v76 a52 15 0 0 0 104 0 v-76" fill="#475569" stroke="#94a3b8" stroke-width="2"/><ellipse cx="1122" cy="177" rx="52" ry="15" fill="#475569" stroke="#94a3b8" stroke-width="2"/><text x="1122" y="221" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">PostgreSQL</text><text x="1122" y="241" text-anchor="middle" font-size="14" fill="#fff" fill-opacity=".9">pgvector</text><line x1="520" y1="257" x2="520" y2="316" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><text x="510" y="294" text-anchor="end" font-size="15" font-weight="600" fill="#94a3b8">policy-routed</text><rect x="430" y="320" width="180" height="46" rx="10" fill="#15803d" stroke="#4ade80" stroke-width="2"/><text x="520.0" y="350.0" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Human approval</text><line x1="672" y1="257" x2="672" y2="316" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#a)"/><text x="682" y="294" text-anchor="start" font-size="15" font-weight="600" fill="#94a3b8">traces, cost</text><rect x="622" y="320" width="160" height="46" rx="10" fill="#475569" stroke="#94a3b8" stroke-width="2"/><text x="702.0" y="350.0" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">OpenTelemetry</text></svg>
